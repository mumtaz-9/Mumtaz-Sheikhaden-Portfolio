<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project Title</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="project-page">

  <!-- HEADER -->
  <header class="project-header">
    <h1 id="project-title">PROJECT TITLE</h1>
    <p id="project-tagline" >Short one-line description</p>
  </header>

  <!-- META INFO -->
  <section class="project-meta card" id="project-meta">
    <div><strong>ROLE</strong><br>Designer / Developer</div>
    <div><strong>DURATION</strong><br>Jan–Mar 2024</div>
    <div><strong>TOOLS</strong><br>Figma, HTML, CSS</div>
    <div><strong>STATUS</strong><br>80% Complete</div>
  </section>

  <!-- HERO IMAGE -->
  <section class="project-hero">
    <img id="project-hero" src="" alt="Project preview">
  </section>

  <!-- OVERVIEW -->
  <section class="project-section card" id="project-overview">
    <h2>OVERVIEW</h2>
    <p>
    </p>
  </section>

  <section class="project-section card" id="project-video-section" style="display:none;">
    <h2>DEMO VIDEO</h2>
    <video id="project-video" width="100%" controls>
      Your browser does not support the video tag.
    </video>
  </section>

  <section class="project-section card" id="project-pdf-section" style="display:none;">
    <h2>PROJECT DOCUMENTATION</h2>
    <iframe id="project-pdf" src="" width="100%" height="600px"></iframe>
    <p><a id="pdf-download-link" href="#" target="_blank">Open PDF in new tab</a></p>
  </section>

  <section class="project-section card" id="project-site-section" style="display:none;">
    <h2>LIVE WEBSITE</h2>
    <div class="iframe-container">
      <iframe id="project-site-embed" src="" width="100%" height="600px" frameborder="0"></iframe>
    </div>
    <p style="margin-top: 10px;">
      <a id="site-external-link" href="#" target="_blank">Visit Live Site →</a>
    </p>
  </section>

  <!-- PROCESS -->
  <section class="project-section card" id="project-process">
    <h2>PROCESS</h2>
    <ul>
    </ul>
  </section>

  <!-- GALLERY -->
  <section class="project-gallery" id="project-gallery">
    <!--<img src="../assets/images/screen1.png" alt="">
    <img src="../assets/images/screen2.png" alt="">
    <img src="../assets/images/screen3.png" alt="">-->
  </section>

  <!-- OUTCOME -->
  <section class="project-section card" id="project-outcome">
    <h2>OUTCOME</h2>
    <p>
    </p>
  </section>

  <!-- NAV -->
  <nav class="project-nav">
    <a href="projects-page.html">← BACK TO PROJECTS</a>
  </nav>

</main>

<script src="project-data.js"></script>
<script src="project-page.js"></script>

</body>
</html>
